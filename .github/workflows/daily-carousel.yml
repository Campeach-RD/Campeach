name: Carrusel diario de Campeach

on:
  schedule:
    # GitHub puede demorar el inicio. Arrancamos antes y esperamos hasta las 4:00 p. m. AST para publicar.
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      camp:
        description: "ID opcional del campamento"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: campeach-daily-carousel
  cancel-in-progress: false

jobs:
  prepare-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      ADMIN_TOKEN: ${{ secrets.CAMPEACH_ADMIN_API_TOKEN }}
      WORKER_URL: https://campeach-instagram.nomanychat.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Preparar fotos uniformes
        run: |
          python -m pip install -r automation/requirements.txt
          python scripts/cloud-daily-carousel.py --camp "${{ inputs.camp }}"
      - name: Guardar fotos en GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Campeach Automation"
          git config user.email "campingsrd@gmail.com"
          git add public/carousels automation/carousel-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepara carrusel diario $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Construir web
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Desplegar fotos en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publicar carrusel en Instagram
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json, os, time
          from pathlib import Path
          import requests

          result = json.loads(Path("automation/work/carousel-result.json").read_text(encoding="utf-8"))
          revision = os.popen("git rev-parse --short HEAD").read().strip()
          urls = [f"https://campeach-rd.github.io/Campeach/carousels/{Path(path).name}?rev={revision}" for path in result["outputs"]]
          for url in urls:
              for _ in range(60):
                  response = requests.get(url, timeout=30)
                  if response.status_code == 200 and response.headers.get("content-type", "").startswith("image/jpeg"):
                      break
                  time.sleep(10)
              else:
                  raise RuntimeError(f"La foto no quedó pública: {url}")

          # No publicar antes de las 4:00 p. m. AST (20:00 UTC), aunque GitHub inicie temprano.
          now = dt.datetime.now(dt.timezone.utc)
          target = now.replace(hour=20, minute=0, second=0, microsecond=0)
          if now < target:
              delay = (target - now).total_seconds()
              print(f"Esperando {int(delay)} segundos hasta las 4:00 p. m. AST")
              time.sleep(delay)

          endpoint = os.environ["WORKER_URL"] + "/instagram/admin/publish-carousel"
          payload = {"campId": result["campId"], "imageUrls": urls}
          last_error = None
          for attempt in range(1, 7):
              try:
                  response = requests.post(
                      endpoint,
                      headers={"Authorization": f"Bearer {os.environ['ADMIN_TOKEN']}"},
                      json=payload,
                      timeout=360,
                  )
                  if response.ok:
                      published = response.json()
                      if not published.get("mediaId"):
                          raise RuntimeError(f"Meta no devolvió mediaId: {published}")
                      print(json.dumps(published, ensure_ascii=False))
                      break
                  detail = response.text[:1000]
                  last_error = RuntimeError(f"HTTP {response.status_code}: {detail}")
                  if response.status_code < 500 and response.status_code != 429:
                      raise last_error
              except requests.RequestException as error:
                  last_error = error
              if attempt == 6:
                  raise last_error or RuntimeError("No se pudo publicar el carrusel")
              wait = min(15 * (2 ** (attempt - 1)), 120)
              print(f"Intento {attempt} falló; reintentando en {wait} segundos: {last_error}")
              time.sleep(wait)
          PY
