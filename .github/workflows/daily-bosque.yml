name: Ritmo del Bosque diario (nube)
on:
  # Repetitive daily promotion paused after the 2026-10-23 review.
  workflow_dispatch:
    inputs:
      date:
        description: Fecha del video (vacío = mañana)
        default: ''
      publish:
        description: Publicar hoy en Instagram
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: campeach-bosque-daily
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: github-pages
    steps:
      - uses: actions/checkout@v6
      - name: Fecha y ventana de promoción
        id: day
        env:
          TEST_DATE: ${{ inputs.date }}
        run: |
          DAY="${TEST_DATE:-$(TZ=America/Santo_Domingo date -d tomorrow +%F)}"
          echo "date=$DAY" >> "$GITHUB_OUTPUT"
          if [[ "$DAY" < '2026-10-11' || "$DAY" > '2026-10-30' || -f "automation/bosque-receipts/$DAY.json" || -f "public/reels/ritmo-bosque-$DAY.mp4" ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.day.outputs.skip != 'true'
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        if: steps.day.outputs.skip != 'true'
        with:
          node-version: '24'
      - name: Dependencias gratuitas
        if: steps.day.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation
          pip install requests
      - name: Crear reel
        if: steps.day.outputs.skip != 'true'
        run: python scripts/cloud-bosque.py render --date '${{ steps.day.outputs.date }}'
      - name: Guardar video para alojamiento
        if: steps.day.outputs.skip != 'true'
        run: |
          git config user.name 'Campeach automation'
          git config user.email 'actions@users.noreply.github.com'
          git add "public/reels/ritmo-bosque-${{ steps.day.outputs.date }}.mp4"
          git diff --cached --quiet || git commit -m 'Preparar reel diario Ritmo del Bosque'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Construir web
        if: steps.day.outputs.skip != 'true'
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
        if: steps.day.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.day.outputs.skip != 'true'
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        if: steps.day.outputs.skip != 'true'
      - name: Verificar o publicar a las 6 p. m.
        if: steps.day.outputs.skip != 'true'
        env:
          CAMPEACH_ADMIN_API_TOKEN: ${{ secrets.CAMPEACH_ADMIN_API_TOKEN }}
          VIDEO_URL: https://campeach-rd.github.io/Campeach/reels/ritmo-bosque-${{ steps.day.outputs.date }}.mp4
          LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          for i in {1..30}; do curl --fail --silent --head "$VIDEO_URL" >/dev/null && break; sleep 10; done
          if [[ "$LIVE" == 'true' ]]; then python scripts/cloud-bosque.py publish; else python scripts/cloud-bosque.py publish --dry-run; fi
      - name: Guardar comprobante de publicación
        if: steps.day.outputs.skip != 'true' && github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          git add automation/bosque-receipts
          git diff --cached --quiet || git commit -m 'Comprobante Instagram Ritmo del Bosque'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always() && steps.day.outputs.skip != 'true'
        with:
          name: bosque-${{ steps.day.outputs.date }}
          path: automation/bosque-work
