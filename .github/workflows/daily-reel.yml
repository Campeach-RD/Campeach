name: Reel diario de Campeach

on:
  schedule:
    # Chatterbox CPU necesita preparación; la publicación espera hasta las 11:00 AST.
    - cron: "10 14 * * *"
  workflow_dispatch:
    inputs:
      camp:
        description: "ID opcional del campamento"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: campeach-daily-reel
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      CAMPEACH_ADMIN_API_TOKEN: ${{ secrets.CAMPEACH_ADMIN_API_TOKEN }}
      CAMPEACH_WORKER_URL: https://campeach-instagram.nomanychat.workers.dev
      CAMPEACH_VOICE_CACHE: /home/runner/.cache/campeach-voice
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            automation/requirements.txt
            automation/chatterbox-requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/campeach-voice
          key: campeach-mexican-voice-v1-pinned-cpu
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r automation/requirements.txt -r automation/chatterbox-requirements.txt
      - name: Producir y validar Reel
        env:
          CAMP: ${{ inputs.camp }}
        run: python scripts/cloud-daily-reel-hyperframes.py --camp "$CAMP"
      - name: Guardar diagnóstico privado del Reel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campamento-reel-diagnostico
          retention-days: 3
          path: |
            automation/work/result.json
            automation/work/voice-audit.json
            automation/work/hyperframes-project/snapshots/
      - name: Publicar MP4 en GitHub Pages
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Campeach Automation"
          git config user.email "campingsrd@gmail.com"
          output=$(python -c 'import json; print(json.load(open("automation/work/result.json", encoding="utf-8"))["output"])')
          git pull --rebase origin main
          git add -- "$output"
          if ! git diff --cached --quiet; then
            git commit -m "Publica Reel diario $(date -u +%F)"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              if [[ "$attempt" == 3 ]]; then exit 1; fi
              git pull --rebase origin main
            done
          else
            git pull --rebase origin main
          fi
          file_name=$(basename "$output")
          url="https://campeach-rd.github.io/Campeach/reels/${file_name}?rev=$(git rev-parse --short HEAD)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Construir sitio con el nuevo Reel
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Desplegar sitio y Reel en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Esperar publicación de GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            type=$(curl -sSIL -o /dev/null -w '%{http_code} %{content_type}' '${{ steps.asset.outputs.url }}')
            if [[ "$type" == 200\ video/mp4* ]]; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Publicar en Instagram y registrar historial
        env:
          VIDEO_URL: ${{ steps.asset.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import requests

          root = Path.cwd()
          result = json.loads((root / "automation/work/result.json").read_text(encoding="utf-8"))
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              ast = timezone(timedelta(hours=-4))
              now = datetime.now(ast)
              target = now.replace(hour=11, minute=0, second=0, microsecond=0)
              while datetime.now(ast) < target:
                  time.sleep(min(30, (target - datetime.now(ast)).total_seconds()))
              if datetime.now(ast).date().isoformat() != result["date"][:10]:
                  raise RuntimeError("El Reel no corresponde a hoy; no publicar contenido atrasado")
          catalog = json.loads((root / "worker/catalog.generated.json").read_text(encoding="utf-8"))
          normalize_id = lambda value: str(value).replace("ñ", "n").replace("Ñ", "N")
          camp = next(item for item in catalog["camps"] if normalize_id(item["id"]) == normalize_id(result["campId"]))
          response = requests.post(
              os.environ["CAMPEACH_WORKER_URL"] + "/instagram/admin/publish-reel",
              headers={"Authorization": f"Bearer {os.environ['CAMPEACH_ADMIN_API_TOKEN']}"},
              json={
                  "videoUrl": os.environ["VIDEO_URL"],
                  "caption": result["caption"],
                  "campId": camp["id"],
                  "campName": camp["name"],
                  "pdfUrl": camp["pdfUrl"],
                  "idempotencyKey": result["idempotencyKey"],
              },
              timeout=360,
          )
          response.raise_for_status()
          published = response.json()
          result["videoUrl"] = os.environ["VIDEO_URL"]
          result["instagramMediaId"] = published["mediaId"]
          history_path = root / "automation/reel-history.json"
          history = json.loads(history_path.read_text(encoding="utf-8"))
          if not any(item.get("idempotencyKey") == result["idempotencyKey"] for item in history):
              history.append(result)
          history_path.write_text(json.dumps(history, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git add automation/reel-history.json
          git stash push --include-untracked --keep-index -m "reel-temporales" >/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Registra Reel diario $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
