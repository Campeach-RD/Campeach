name: Validar estrategia editorial
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'worker/**'
      - 'automation/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation
          python -m pip install -r automation/requirements.txt
          npm ci
      - name: Validar contenido sin publicar
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s scripts -p test_content_strategy.py
          node automation/bosque-scheduler/test.mjs
          npm test
          npm run worker:typecheck
          npm run build
